<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Proposición 59 · Debate MinAgricultura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tablero de sesión: portada por entidad → vistas con fichas, hilo, datos y hallazgos; cada cifra abre su tabla de origen */
:root{
  --lima:#8CD44F; --verde:#0F7A3D; --verde-hondo:#0A4F2A; --verde-tenue:#EDF5EC;
  --tinta:#0E1A13; --gris:#55645A; --linea:#D6E2D8; --fondo:#F5F7F4; --tarjeta:#FFFFFF;
  --sobre:#FFFFFF;
  --c-madr:#0F7A3D; --c-upra:#1F6F8B; --c-ant:#B5500F; --c-cruce:#6B4FBB; --c-matriz:#4A5C7A; --c-guion:#7A4A6B; --c-eq:#8C5A12;
  --grave:#B42318; --media:#B5500F; --alerta:#8A6D0B; --forma:#5B6B61;
  --s1:#0F7A3D; --s2:#8CD44F; --s3:#1F6F8B; --s4:#B5500F; --s5:#6B4FBB; --s6:#B08A1E; --s7:#8FA697; --s8:#C9D6CC;
  --ok:#0F7A3D; --parcial:#B08A1E; --mal:#B42318; --nada:#8FA697; --prorroga:#B5500F;
  --sombra:0 1px 0 rgba(14,26,19,.05), 0 10px 26px -20px rgba(14,26,19,.55);
  --r:10px;
  --f-disp:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;
  --f-txt:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lima:#8CD44F; --verde:#3DAE6B; --verde-hondo:#9FE3AE; --verde-tenue:#16241B;
    --tinta:#E9F1E9; --gris:#A3B3A8; --linea:#2A392E; --fondo:#0D120E; --tarjeta:#151E17; --sobre:#0D120E;
    --c-madr:#5CC489; --c-upra:#6FBBD6; --c-ant:#F0913F; --c-cruce:#A992F0; --c-matriz:#9DB0CF; --c-guion:#D59BC2; --c-eq:#E0B062;
    --grave:#FF7B6E; --media:#F0913F; --alerta:#E2C04D; --forma:#A3B3A8;
    --s1:#3DAE6B; --s2:#8CD44F; --s3:#6FBBD6; --s4:#F0913F; --s5:#A992F0; --s6:#E2C04D; --s7:#6F8577; --s8:#3A4A3F;
    --ok:#5CC489; --parcial:#E2C04D; --mal:#FF7B6E; --nada:#6F8577; --prorroga:#F0913F;
    --sombra:0 1px 0 rgba(0,0,0,.5), 0 10px 26px -20px #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --lima:#8CD44F; --verde:#3DAE6B; --verde-hondo:#9FE3AE; --verde-tenue:#16241B;
  --tinta:#E9F1E9; --gris:#A3B3A8; --linea:#2A392E; --fondo:#0D120E; --tarjeta:#151E17; --sobre:#0D120E;
  --c-madr:#5CC489; --c-upra:#6FBBD6; --c-ant:#F0913F; --c-cruce:#A992F0; --c-matriz:#9DB0CF; --c-guion:#D59BC2; --c-eq:#E0B062;
  --grave:#FF7B6E; --media:#F0913F; --alerta:#E2C04D; --forma:#A3B3A8;
  --s1:#3DAE6B; --s2:#8CD44F; --s3:#6FBBD6; --s4:#F0913F; --s5:#A992F0; --s6:#E2C04D; --s7:#6F8577; --s8:#3A4A3F;
  --ok:#5CC489; --parcial:#E2C04D; --mal:#FF7B6E; --nada:#6F8577; --prorroga:#F0913F;
  --sombra:0 1px 0 rgba(0,0,0,.5), 0 10px 26px -20px #000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f-txt);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.lienzo{max-width:1200px;margin:0 auto;padding-inline:18px;padding-block:20px 60px}
h1,h2,h3,h4,h5{font-family:var(--f-disp);font-weight:700;letter-spacing:.005em;text-wrap:balance}
button{font-family:inherit}
.num-t{font-variant-numeric:tabular-nums}

/* encabezado */
.tope{background:var(--c,var(--verde));color:var(--sobre);border-radius:var(--r) var(--r) 0 0;padding:16px 22px 14px;
  border-bottom:4px solid var(--lima);display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap}
.tope h1{margin:0;font-size:clamp(22px,2.8vw,31px);line-height:1.08;flex:1 1 300px}
.tope h1 .sub{display:block;font-family:var(--f-txt);font-weight:500;font-size:14px;opacity:.92;margin-top:4px;letter-spacing:0}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{background:transparent;color:var(--sobre);border:1px solid currentColor;border-radius:999px;padding:7px 14px;
  font:600 13px/1 var(--f-txt);cursor:pointer;opacity:.95}
.btn:hover{opacity:1;background:rgba(127,127,127,.18)}
.btn kbd{font:600 11px/1 var(--f-txt);border:1px solid currentColor;border-radius:4px;padding:1px 4px;margin-left:5px;opacity:.8}
.meta{background:var(--tarjeta);border:1px solid var(--linea);border-top:0;border-radius:0 0 var(--r) var(--r);padding:12px 22px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px 24px;box-shadow:var(--sombra)}
.meta div{font-size:13.2px;color:var(--gris);min-width:0}
.meta b{display:block;color:var(--tinta);font-weight:600;font-size:14px}
.rotulo-seccion{font-size:23px;margin:30px 0 4px}
.instruccion{margin:0 0 14px;color:var(--gris);font-size:14.5px;max-width:88ch}
.lectura{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:14px 20px;box-shadow:var(--sombra);display:grid;gap:8px}
.lectura p{margin:0;font-size:15.2px;max-width:96ch;padding-left:14px;border-left:3px solid var(--c,var(--verde))}

/* tarjetas de entrada */
.entradas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.entrada{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tarjeta);border:1px solid var(--linea);border-top:5px solid var(--c);
  border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sombra);transition:transform .15s,border-color .15s}
.entrada:hover{transform:translateY(-2px);border-color:var(--c)}
.entrada:focus-visible{outline:3px solid var(--c-ant);outline-offset:2px}
.sigla{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;color:var(--c)}
.nombre{font-weight:600;font-size:15px;line-height:1.3}
.nota{font-size:13.8px;color:var(--gris);line-height:1.45}
.entrada .pie{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--linea)}
.entrada .cont{color:var(--gris)}
.entrada .ir{color:var(--c);font-weight:700}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-top:13px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--tarjeta);border:1px solid var(--linea);border-top:4px solid var(--c,var(--verde));border-radius:9px;padding:13px 15px 12px;box-shadow:var(--sombra);position:relative;min-width:0}
.kpi.dato{cursor:pointer}
.kpi.dato:hover{border-color:var(--c,var(--verde))}
.kpi b{display:block;font-family:var(--f-disp);font-size:31px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span.t{display:block;font-size:13.2px;color:var(--gris);margin-top:4px;line-height:1.35}
.kpi.alerta{border-top-color:var(--media)}
.kpi.alerta b{color:var(--media)}
.lupa{position:absolute;top:8px;right:10px;color:var(--gris);font-size:15px}
.ref{display:inline-block;border:1px solid var(--linea);border-radius:4px;padding:1px 6px;font:600 11px/1.5 var(--f-txt);color:var(--gris);white-space:nowrap;vertical-align:2px}
.kpi .ref{margin-top:8px}
.ent-tag{display:inline-block;background:var(--c);color:var(--sobre);border-radius:4px;padding:2px 8px;font:700 11px/1.5 var(--f-txt);letter-spacing:.04em;margin-right:6px;vertical-align:2px}

/* bloque respuestas */
.respuestas{display:grid;grid-template-columns:minmax(210px,270px) 1fr;gap:14px;margin-top:18px}
.rotulo{background:var(--c);color:var(--sobre);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.rotulo b{font-family:var(--f-disp);font-size:31px;font-weight:700;line-height:1}
.rotulo span{font-size:13.4px;line-height:1.4;opacity:.93}
.fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--sombra);align-content:flex-start}
.chip{background:var(--tarjeta);border:1.6px solid var(--linea);border-radius:8px;padding:9px 14px;font:600 14.5px/1.15 var(--f-txt);color:var(--tinta);
  cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:128px;text-align:left;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--c)}
.chip[aria-expanded="true"]{border-color:var(--c);background:var(--verde-tenue);box-shadow:inset 0 -3px 0 var(--c)}
.chip em{font:500 11.8px/1.2 var(--f-txt);font-style:normal;color:var(--gris)}
.chip.mudo em{color:var(--media)}
:focus-visible{outline:3px solid var(--c-ant);outline-offset:2px}

/* panel */
.panel{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);border-left:6px solid var(--c);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sombra)}
.panel-tope{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px 12px}
.panel-tope h3{margin:0;font-size:25px;line-height:1.12}
.panel-tope p{grid-column:1/-1;margin:0;color:var(--gris);font-size:14px;max-width:92ch}
.btn-claro{border:1px solid var(--linea);background:transparent;color:var(--gris);border-radius:999px;padding:6px 13px;font:600 12.5px/1.1 var(--f-txt);cursor:pointer;white-space:nowrap}
.btn-claro:hover{color:var(--tinta);border-color:var(--gris)}
.cerrar{border:1px solid var(--linea);background:var(--tarjeta);color:var(--gris);border-radius:999px;width:34px;height:34px;font-size:19px;line-height:1;cursor:pointer;flex:none}
.cerrar:hover{color:var(--tinta);border-color:var(--gris)}
.estado{border-radius:999px;padding:5px 12px;font:600 12.5px/1 var(--f-txt);white-space:nowrap}
.estado.si{background:var(--verde-tenue);color:var(--ok);border:1px solid var(--ok)}
.estado.no{color:var(--media);border:1px solid var(--media)}
.punto{border-top:1px solid var(--linea);padding:17px 0 6px;display:grid;grid-template-columns:40px 1fr;gap:14px}
.punto:first-of-type{margin-top:12px}
.punto .num{font-family:var(--f-disp);font-size:24px;font-weight:700;color:var(--c);line-height:1}
.punto h4{margin:0 0 9px;font-size:18.5px;line-height:1.2}
.punto dl{margin:0;display:grid;gap:10px}
.punto dt{font:700 11.4px/1.2 var(--f-txt);color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.punto dd{margin:3px 0 0;font-size:15px;max-width:82ch}
.punto .rep dt{color:var(--media)}
.punto .rep dd{border-left:3px solid var(--media);padding-left:12px}
.repregunta{all:unset;cursor:pointer;display:block}
.repregunta:hover{text-decoration:underline;text-decoration-color:var(--media)}
.pista{display:block;font-size:12.5px;color:var(--c,var(--verde));font-weight:600;margin-top:4px}
.vacio{margin:16px 0 0;padding:16px 18px;border:1px dashed var(--linea);border-radius:9px;font-size:15px;color:var(--gris);max-width:80ch}

/* secciones */
.seccion{margin-top:32px}
.barra{background:var(--c,var(--verde));color:var(--sobre);border-radius:var(--r);padding:14px 22px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;border-left:6px solid var(--lima)}
.barra h2{margin:0;font-size:clamp(19px,2.3vw,26px);line-height:1.12}
.barra .apunte{grid-column:1/-1;font-size:13.4px;opacity:.93;font-weight:500;max-width:96ch}
.barra .btn{justify-self:end}

.tabla-caja{margin-top:13px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sombra)}
.tabla-caja table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.2px}
.tabla-caja th,.tabla-caja td{padding:13px 16px;border-bottom:1px solid var(--linea);vertical-align:top;text-align:left}
.tabla-caja thead th{background:var(--verde-tenue);font:700 12px/1.2 var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.tabla-caja tbody tr:last-child td{border-bottom:0}
.tabla-caja tbody tr:hover{background:var(--verde-tenue)}
td.n{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--c,var(--verde));width:52px;white-space:nowrap}
td.rep{color:var(--media);font-weight:500;position:relative;padding-right:46px}
.copiar{position:absolute;top:10px;right:9px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--gris);border-radius:6px;width:28px;height:26px;font-size:12px;cursor:pointer;line-height:1}
.copiar:hover{color:var(--tinta);border-color:var(--gris)}
.copiar.ok{color:var(--ok);border-color:var(--ok)}
.seg{display:inline-flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--linea);background:transparent;color:var(--gris);border-radius:999px;padding:3px 9px;font:600 11.5px/1.2 var(--f-txt);cursor:pointer}
.seg button[aria-pressed="true"][data-v="si"]{background:var(--ok);border-color:var(--ok);color:var(--sobre)}
.seg button[aria-pressed="true"][data-v="evade"]{background:var(--mal);border-color:var(--mal);color:var(--sobre)}
.seg button[aria-pressed="true"][data-v="pend"]{background:var(--parcial);border-color:var(--parcial);color:var(--sobre)}

/* gráficas */
.graficas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px}
.grafica{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px 16px;box-shadow:var(--sombra);display:flex;flex-direction:column;min-width:0}
.grafica h4{margin:0 0 3px;font-size:17.5px;line-height:1.15}
.grafica p.lect{margin:0 0 14px;font-size:13.4px;color:var(--gris);max-width:62ch}
.grafica svg{width:100%;height:auto;display:block;overflow:visible}
.grafica svg text{fill:var(--tinta);font-family:var(--f-txt)}
.grafica svg .tenue{fill:var(--gris)}
.grafica svg .riel{fill:var(--tinta);opacity:.07}
.grafica svg .eje{stroke:var(--tinta);opacity:.14}
.grafica svg g.dato{cursor:pointer}
.grafica svg g.dato:hover rect.m,.grafica svg g.dato:hover path{opacity:.82}
.grafica svg g.dato:focus-visible{outline:2px solid var(--c-ant)}
.grafica svg.rosca{max-width:230px;margin:0 auto}
.leyenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px 14px;margin-top:12px;font-size:12.8px}
.leyenda>div{min-width:0}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:7px}
.leyenda span{color:var(--gris)}
.grafica .fuente{margin-top:auto;padding-top:12px;font-size:12px;color:var(--gris)}

/* hallazgos */
.lista-hallazgos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:13px}
.hallazgo{background:var(--tarjeta);border:1px solid var(--linea);border-left:5px solid var(--sevc);border-radius:9px;padding:13px 15px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:7px;min-width:0}
.hallazgo.dato{cursor:pointer}
.hallazgo.dato:hover{border-color:var(--sevc)}
.hallazgo h5{margin:0;font-size:16.5px;line-height:1.22}
.hallazgo p{margin:0;font-size:14px}
.hallazgo p.preg{color:var(--media);font-weight:500;border-top:1px dashed var(--linea);padding-top:7px}
.hallazgo .pag{font-size:12px;color:var(--gris);margin-top:auto}
.sev{display:inline-block;border-radius:4px;padding:2px 7px;font:700 10.5px/1.4 var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--sobre);background:var(--sevc);margin-right:7px;vertical-align:2px}
.grave{--sevc:var(--grave)} .media{--sevc:var(--media)} .alerta{--sevc:var(--alerta)} .forma{--sevc:var(--forma)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filtros button{border:1.5px solid var(--linea);background:var(--tarjeta);color:var(--tinta);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--f-txt);cursor:pointer}
.filtros button[aria-pressed="true"]{border-color:var(--tinta)}

/* matriz */
.matriz-caja{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sombra)}
.matriz{border-collapse:collapse;width:100%;min-width:960px;font-size:14px}
.matriz th,.matriz td{border-bottom:1px solid var(--linea);padding:9px 10px;text-align:left;vertical-align:middle}
.matriz thead th{background:var(--verde-tenue);font:700 12px/1.2 var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--gris);position:sticky;top:0}
.matriz td.q{font-family:var(--f-disp);font-weight:700;font-size:19px;color:var(--c-matriz);width:44px}
.matriz td.tema{min-width:220px}
.matriz td.tema small{display:block;color:var(--gris);font-size:12.4px;line-height:1.35;margin-top:2px}
.matriz tr.grupo-m td{background:var(--fondo);font:700 12px/1.2 var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--gris);padding:8px 10px}
.cel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:7px;border-radius:6px;padding:6px 9px;font-size:13px;font-weight:600;width:100%;min-width:118px;border:1.5px solid transparent}
.cel:hover{border-color:var(--linea)}
.cel i{width:12px;height:12px;border-radius:3px;flex:none;background:var(--st)}
.cel.na{color:var(--gris);font-weight:500;cursor:default}
.cel.na i{background:transparent;border:1.5px dashed var(--nada)}
.st-si{--st:var(--ok)} .st-parcial{--st:var(--parcial)} .st-evade{--st:var(--mal)} .st-traslada{--st:var(--nada)} .st-prorroga{--st:var(--prorroga)}
.clave{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;color:var(--gris);margin-top:12px}
.clave span{display:inline-flex;align-items:center;gap:6px}
.clave i{width:12px;height:12px;border-radius:3px;background:var(--st)}
.barra-23{display:flex;height:34px;border-radius:7px;overflow:hidden;margin-top:12px;border:1px solid var(--linea)}
.barra-23 button{all:unset;cursor:pointer;background:var(--st);color:var(--sobre);font:700 13px/34px var(--f-txt);text-align:center;min-width:0;white-space:nowrap;overflow:hidden}
.barra-23 button:hover{filter:brightness(1.08)}

/* guion */
.guion{display:grid;gap:12px;margin-top:14px}
.bloque{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);display:grid;grid-template-columns:86px 1fr;overflow:hidden}
.bloque .min{background:var(--verde-tenue);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 6px;gap:2px;border-right:1px solid var(--linea)}
.bloque .min b{font-family:var(--f-disp);font-size:28px;line-height:1;color:var(--c-guion)}

   preg:["¿Cuál es el nombre, acto de adopción, documento rector y fecha de vigencia de la política del Gobierno para implementar el artículo 64? Si no existe, ¿por qué la respuesta habla de «la política sectorial» en singular?","¿El Ministerio considera que todos sus programas rurales son automáticamente política campesina, o aplica criterios de identificación?","¿Qué ocurrió con la política ordenada por el artículo 253 de la Ley 1955 de 2019, y cómo se actualizó después del Acto Legislativo 01 de 2023?","¿Qué subsistemas del Sistema Nacional de Reforma Agraria tienen metas para población campesina, qué entidad responde por cada una y cuánto se asignó y ejecutó en 2024, 2025 y 2026?","¿Cuántas sesiones de la Comisión Mixta Nacional se hicieron, qué propuestas se aprobaron o rechazaron, cuáles tienen presupuesto y qué porcentaje de compromisos se cumplió?","¿Cuánto marcó el trazador campesino en 2025 y 2026, cuánto se apropió, comprometió, obligó y pagó, y qué parte es inversión nueva?","¿Qué indicador usa el Ministerio para demostrar que la política mejora el derecho a la alimentación y no solo la producción o las hectáreas?"],
   interv:["Señor presidente, señoras y señores senadores, señor ministro:","Me quiero referir a la respuesta dada al primer interrogante del cuestionario. Debo precisarle al ministro que la pregunta formulada no solicitaba una declaración general sobre la importancia del campesinado. Preguntaba cuál es la política concreta del Gobierno Nacional para implementar el artículo 64 de la Constitución, modificado por el Acto Legislativo 01 de 2023.","La respuesta ministerial reconoce correctamente que el campesinado es sujeto de derechos y de especial protección constitucional. Sin embargo, resulta materialmente insuficiente para un debate de control político. No identifica el nombre oficial de la política, el acto que la adopta, sus metas, responsables, cronograma, presupuesto, indicadores, cobertura territorial ni resultados verificables.","El problema no es solamente que la respuesta sea breve. El problema es que presenta una orientación discursiva, pero no demuestra la existencia y operación de una política pública controlable.","El artículo 64 no reconoce al campesinado únicamente como productor de alimentos. Reconoce su relación con la tierra, el territorio, el agua, las semillas, la biodiversidad, el ambiente, la participación, la conectividad, la infraestructura, la asistencia técnica, el valor agregado y la comercialización. También exige igualdad material para mujeres, jóvenes y territorios.","Por eso resulta preocupante que la respuesta reduzca la política sectorial al fortalecimiento de capacidades productivas, técnicas, organizativas y comerciales. Esa visión puede convertir a un sujeto constitucional de derechos en una simple categoría productiva.","Además, la respuesta omite instrumentos fundamentales: la política ordenada por el artículo 253 de la Ley 1955 de 2019; el Sistema Nacional de Reforma Agraria y Desarrollo Rural previsto en la Ley 2294 de 2023; el Decreto 1406 de 2023; la Comisión Mixta Nacional para Asuntos Campesinos; los Territorios Campesinos Agroalimentarios; las Zonas de Reserva Campesina; el trazador presupuestal campesino y el Documento CONPES 4184 de 2026.","El DANE estima que 10,4 millones de personas de 15 años o más se identifican subjetivamente como campesinas. Estamos hablando del 25,4 % de esa población. No es aceptable que frente a una población de esta magnitud el Gobierno responda sin presentar metas, recursos ni resultados.","Señor Ministro, le solicito responder con precisión: ¿Cuál es el nombre, acto de adopción y documento rector de esta política? ¿Qué presupuesto fue apropiado, comprometido, obligado y pagado en 2024, 2025 y 2026? ¿Qué metas tienen la ANT, la ADR, la UPRA y las demás entidades? ¿Qué compromisos de la Comisión Mixta fueron financiados y cumplidos? ¿Cuánto de lo reportado por el trazador presupuestal corresponde a inversión nueva y cuánto a gasto preexistente?","Propongo que el Ministerio entregue al Senado, en un plazo definido, una matriz pública de implementación con metas, responsables, presupuesto, indicadores, avances y riesgos, desagregada por mujeres, jóvenes y territorios.","El campesinado no necesita únicamente reconocimiento constitucional. Necesita una política identificable, financiada, participativa y evaluable. Esa es la obligación que hoy debe explicar el Gobierno Nacional ante este Senado."]},

   interv:["Señor presidente, señoras y señores senadores, señor ministro:","Me quiero referir a la respuesta dada al segundo interrogante del cuestionario, relacionada con los lineamientos y proyecciones de política pública del Ministerio de Agricultura frente a las obligaciones del Acuerdo Final de Paz.","Debo comenzar reconociendo que existe una arquitectura institucional y normativa: el Plan Estratégico Sectorial 2022–2026, el Sistema Nacional de Reforma Agraria y Desarrollo Rural, los planes nacionales sectoriales de riego, generación de ingresos, comercialización y asistencia técnica, además de instrumentos de crédito y seguro.","Pero la existencia de esa arquitectura no equivale, por sí sola, al cumplimiento del Acuerdo de Paz.","La respuesta del Ministerio es concreta al identificar instrumentos de formalización de la propiedad rural, riego y drenaje, financiación, garantías e incentivos. También asigna algunas responsabilidades entre el Ministerio, la Agencia Nacional de Tierras y la Agencia de Desarrollo Rural.","Sin embargo, la respuesta es materialmente incompleta en sus proyecciones. No presenta una matriz integral que permita saber, para cada obligación, cuál es la meta, qué presupuesto se asignó, qué entidad ejecuta, en qué territorio, qué población fue beneficiada y cuál es el resultado jurídico, productivo y social verificable.","La propia respuesta reconoce que existen reprocesos técnicos que superan los tiempos previstos. Esto afecta la validación de líneas base, la desagregación por género y etnia y la territorialización de los resultados. Por tanto, el Senado no puede limitarse a recibir una relación de planes y programas; necesita información comparable y auditable.","La pregunta central no es cuántos instrumentos existen. La pregunta es qué decisión sectorial produjo cada avance. Cuántas hectáreas fueron efectivamente adjudicadas y registradas; cuántas permanecen en situación provisional; qué resultados tienen los programas de riego; cuántos productores recibieron asistencia técnica, crédito y seguro; y si esas intervenciones mejoraron sus ingresos, su productividad y su seguridad alimentaria.","Señor Ministro, este debate no pretende desconocer los instrumentos existentes. Pretende verificar si esos instrumentos están produciendo transformación rural. El Senado necesita algo más que arquitectura institucional: necesita resultados comprobables, seguridad jurídica sobre la tierra y respuestas claras sobre quién responde por los rezagos."]},

function aviso(txt){ const a=$("#aviso"); a.textContent=txt; a.hidden=false; clearTimeout(aviso.t); aviso.t=setTimeout(()=>{a.hidden=true;},2200); }
function copiar(txt, boton){
  const ok = ()=>{ aviso("Copiado"); if(boton){ boton.classList.add("ok"); setTimeout(()=>boton.classList.remove("ok"),1400);} };
  const respaldo = ()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let r=false; try{ r=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); r?ok():aviso("No se pudo copiar; seleccione el texto a mano"); };
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, respaldo); return; } }catch(e){}
  respaldo();
}

  ["Sanidad agropecuaria","3","Las seis acciones del ICA y la del SENA en 0 % al primer semestre.","Inversión del ICA −31 %; sanidad $210.000 M → $144.082 M.","Si con más plata en 2026 van en 0 %, ¿qué se espera en 2027?","ss1"],

 preg:["Señor ministro, su respuesta cuenta $153.000 millones de la ANT, la ADR y AGROSAVIA como recursos para El Niño. En el Decreto 1599 la ANT pierde el 60 % de su inversión y la ADR el 46 %. ¿Con qué plata va a atender El Niño el próximo año, si el presupuesto no tiene una sola partida para el fenómeno?",

const PGN_TABS=[["resumen","Resumen"],["nino","El Niño"],["sector","Sector agropecuario"],["cruce","Pregunta vs. presupuesto"],["boy","Boyacá"],["preg","Preguntas"],["fuentes","Fuentes"]];
let pgnTab="resumen";
const pnf = x=>Math.round(x).toLocaleString("es-CO");
const ppc = (a,b)=> a? Math.round((b-a)/a*100):0;
function pgnLeyenda(){ return '<div class="pgn-lg"><span><i style="background:var(--s7)"></i>2026 · Decreto 1477</span><span><i style="background:var(--verde)"></i>2027 · Decreto 1599</span></div>'; }
function pgnBarras(rows){
  const mx=Math.max(...rows.flatMap(r=>[r[2],r[3]]));
  return rows.map(r=>{ const p=ppc(r[2],r[3]);
    const fila=(n,v,c)=>'<div class="pgn-br"><span>'+n+'</span><div class="pgn-bw"><div class="pgn-b" style="width:'+(v/mx*100)+'%;background:'+c+'"></div><span class="pgn-bv" style="left:'+Math.min(v/mx*100,84)+'%">'+pnf(v)+'</span></div></div>';
    return '<div class="pgn-grp"><div class="pgn-t"><span>'+esc(r[0])+(r[1]?' <em>· '+esc(r[1])+'</em>':'')+'</span><span class="'+(p<0?'pgn-baja':'pgn-sube')+'">'+(p>0?'+':'')+p+' %</span></div>'+
      fila("2026",r[2],"var(--s7)")+fila("2027",r[3],"var(--verde)")+(r[4]?'<p class="pgn-nota">'+esc(r[4])+'</p>':'')+'</div>'; }).join("");
}
function pgnBrecha(rows,max){ return rows.map(r=>'<div class="pgn-gr"><div><b>'+esc(r[0])+'</b>'+(r[2]&&r[2].indexOf("var(")<0?'<span>'+esc(r[2])+'</span>':'')+'</div><div class="pgn-gb"><div style="width:'+Math.max(r[1]/max*100,r[1]?1:0)+'%;background:'+(r[2]&&r[2].indexOf("var(")===0?r[2]:'var(--verde)')+'"></div></div><div class="pgn-gn">$'+pnf(r[1])+' M</div></div>').join(""); }
function pgnKpi(v,t,alerta){ return '<div class="kpi'+(alerta?' alerta':'')+'"><b>'+v+'</b><span class="t">'+t+'</span></div>'; }
function vistaPGN(){
  const tabs='<div class="pgn-tabs" role="tablist">'+PGN_TABS.map(t=>'<button type="button" role="tab" data-pgntab="'+t[0]+'" aria-selected="'+(pgnTab===t[0])+'">'+t[1]+'</button>').join("")+'</div>';
  let c="";
  if(pgnTab==="resumen"){
    c='<h2 class="rotulo-seccion">No hay plata para El Niño y se recortan los programas que dicen atenderlo</h2><p class="instruccion">El ministerio identificó una sexta parte de lo que estima necesitar para El Niño, no reporta ejecución, y en 2027 las entidades con las que cuenta pierden la mitad de su inversión.</p>'+
      '<div class="kpis" style="--c:var(--grave)">'+pgnKpi("$0","partida para El Niño en el PGN 2027: ni partida, ni programa, ni artículo en el Decreto 1599",1)+pgnKpi("−44 %","inversión del sector agropecuario: $3,21 bn en 2026 → $1,80 bn en 2027",1)+pgnKpi("−62 %","tierras de la ANT, con 187.940 ha comprometidas sin pagar",1)+pgnKpi("−61 %","gestión del riesgo agropecuario (seguro, ICR y crédito): $400.000 → $156.167",1)+'</div>'+
      '<div class="pgn-2"><div class="pgn-card"><h3>El Niño: necesidades frente a recursos</h3><p class="pgn-sub">Respuesta del MADR a la pregunta 16 (pp. 38–39) · millones de pesos</p>'+pgnBrecha(PGN.gap,1151000)+'<p class="pgn-sub">Lo identificado cubre el 16,7 % de las necesidades. <button class="btn-claro" type="button" data-det="nino">Ver la tabla del MADR</button></p></div>'+
      '<div class="pgn-card"><h3>Inversión por entidad del sector</h3><p class="pgn-sub">Millones de pesos</p>'+pgnLeyenda()+pgnBarras(PGN.ent)+'</div></div>';
  } else if(pgnTab==="nino"){
    c='<h2 class="rotulo-seccion">El Niño en el presupuesto</h2><p class="instruccion">El Decreto 1599 no contiene ninguna partida, programa ni artículo para El Niño. Estos son los rubros más cercanos.</p>'+
      '<div class="pgn-card">'+pgnLeyenda()+pgnBarras(PGN.nino)+'</div>'+
      '<p class="cita" style="--c:var(--alerta)"><b>Por fuera del PGN 2027</b>El plan del MADR de mayo ($146.000 millones) y la adición de $1,2 billones para la crisis energética se tramitan contra el presupuesto de 2026; el Decreto 1599 no les da continuidad en 2027.</p>'+
      '<div class="pgn-card" style="margin-top:14px"><h3>Composición de lo identificado por el MADR</h3><p class="pgn-sub">$192.767,7 millones; solo 20,6 % son medidas del propio ministerio</p>'+pgnBrecha(PGN.compo,128000)+'</div>';
  } else if(pgnTab==="sector"){
    c='<h2 class="rotulo-seccion">Programas que tocan las preguntas del debate</h2><p class="instruccion">Cada programa con su variación de 2026 a 2027 (Decreto 1599) y la pregunta del cuestionario con la que se relaciona. Millones de pesos.</p>'+
      '<div class="pgn-card">'+pgnLeyenda()+pgnBarras(PGN.prog)+'</div>'+
      '<p class="cita"><b>Funcionamiento frente a inversión</b>El funcionamiento del MADR sube de $330.363 a $499.150 millones (+51 %) mientras su inversión baja 52 % (Decreto 1599, p. 21).</p>';
  } else if(pgnTab==="cruce"){
    c='<h2 class="rotulo-seccion">Lo que respondieron frente a lo que dice el PGN</h2><p class="instruccion">En casi todos los temas la respuesta no trae cifras de ejecución y el presupuesto de 2027 recorta el programa que debería producir el resultado.</p>'+
      '<div class="pgn-cx">'+PGN.cruce.map(x=>'<article class="pgn-card"><h3><span>'+esc(x[0])+'</span><em>Preg. '+esc(x[1])+'</em></h3><div class="pgn-r3"><div class="r"><b>Respondió</b>'+esc(x[2])+'</div><div class="p"><b>PGN 2027 · Decreto 1599</b>'+esc(x[3])+'</div><div class="i"><b>Para el debate</b>'+esc(x[4])+'</div></div>'+(x[5]?'<button class="btn-claro" type="button" data-det="'+x[5]+'" style="margin-top:8px">Ver el dato de la respuesta</button>':'')+'</article>').join("")+'</div>';
  } else if(pgnTab==="boy"){
    c='<h2 class="rotulo-seccion">Boyacá</h2><p class="instruccion">La inversión agropecuaria regionalizada en Boyacá cae de $66.697 millones en 2026 a $28.071 millones en 2027 (−58 %). Para 2027 se usa la regionalización indicativa del DNP del 16 de septiembre, que en este sector coincide con lo expedido en el Decreto 1599.</p>'+
      '<div class="kpis">'+pgnKpi("66.697","millones en 2026")+pgnKpi("28.071","millones en 2027 · Decreto 1599 (−58 %)",1)+pgnKpi("−66 %","formalización de predios: 29.898 → 10.139",1)+pgnKpi("$0","FONAT (riego y adecuación de tierras) en 2027",1)+'</div>'+
      '<div class="pgn-card" style="margin-top:14px">'+pgnLeyenda()+pgnBarras(PGN.boy)+'</div>'+
      '<p class="cita"><b>Lectura</b>El FONAT, que financia riego y adecuación de tierras, desaparece de la regionalización de Boyacá en 2027. En el departamento hay dos Zonas de Reserva Campesina (Paraíso Escondido en Togüí y Santuario del Rabanal en Samacá y Ventaquemada) sin presupuesto ni ejecución informados. Ninguna APPA en derogatoria está en Boyacá. <button class="btn-claro" type="button" data-accion="boyaca">Boyacá en las respuestas</button></p>';
  } else if(pgnTab==="preg"){
    c='<h2 class="rotulo-seccion">Preguntas para el senador</h2><p class="instruccion">Marque en vivo si el ministro respondió, evadió o quedó pendiente; se suma al seguimiento del debate de la portada.</p>'+
      '<ol class="preg-anx">'+PGN.preg.map((p,i)=>'<li><span>'+esc(p)+'</span><span class="acc-p"><button class="btn-claro" type="button" data-copiar="'+esc(p)+'">Copiar</button>'+segHTML("pgn-"+i)+'</span></li>').join("")+'</ol>'+
      '<div class="rep-caja"><b>Todas las preguntas</b><p>'+PGN.preg.length+' preguntas sobre el presupuesto 2027</p><button class="btn-claro" type="button" data-copiar="'+esc(PGN.preg.map((p,i)=>(i+1)+". "+p).join("\n\n"))+'">Copiar todas</button></div>';
  } else {
    c='<h2 class="rotulo-seccion">Fuentes</h2><ul class="pgn-src">'+
      '<li>Respuestas a la Proposición 59 de 2026: MADR, radicado 2026-100-021297-1 (5-oct, 58 pp.); UPRA, radicado 2026-1-002865 (7-oct, 10 pp.); ANT, radicado 202610001837991 (6-oct, 3 pp.).</li>'+
      '<li>Decreto 1599 del 22 de octubre de 2026, por el cual se decreta el PGN 2027: secciones 0211 (p. 10), 1301 (p. 16), 1701 (pp. 21–22), 1702, 1715 y 1716 (p. 22), 1717 y 1718 (p. 23), 2101 (p. 25).</li>'+
      '<li>Decreto 1477 de 2025 (PGN 2026), artículo 2.</li><li>DNP: regionalización indicativa PGN 2026 y PGN 2027 (16-sep-2026).</li>'+
      '<li><a href="https://www.eltiempo.com/economia/sectores/gobierno-activa-plan-por-146-000-millones-para-enfrentar-llegada-de-el-nino-y-proteger-al-agro-3556543" target="_blank" rel="noopener">El Tiempo: plan de $146.000 millones para El Niño (18-may-2026)</a></li>'+
      '<li><a href="https://www.elpais.com.co/politica/ministro-de-hacienda-radico-proyecto-para-modificar-el-presupuesto-de-2026-y-atender-crisis-energetica-y-por-el-terremoto-2954.html" target="_blank" rel="noopener">El País: modificación al presupuesto 2026 por crisis energética y terremoto (29-sep-2026)</a></li></ul>'+
      '<p class="cita" style="--c:var(--alerta)"><b>Pendiente de verificar</b>En qué rubro del MADR se financia la UPRA, que no tiene sección propia en el artículo 2 del Decreto 1599.</p>';
  }
  return cabecera("var(--s6)","Presupuesto 2027 frente a las respuestas","Decreto 1599 de 2026 · sector agropecuario, El Niño y Boyacá · millones de pesos",true)+tabs+'<div class="pgn">'+c+'</div>'+
    '<p class="pie-pag">Cifras de 2027 del Decreto 1599 del 22 de octubre de 2026 (PGN 2027) y de 2026 del Decreto 1477 de 2025. Las cifras de las entidades vienen de sus respuestas a la Proposición 59.</p>';
}
document.addEventListener("click",function(e){ const g=e.target.closest("[data-ir-pgnboy]"); if(g){ cerrarModal(); pgnTab="boy"; ir("pgn"); return; } const b=e.target.closest("[data-pgntab]"); if(!b) return; pgnTab=b.dataset.pgntab; render(); const t=document.querySelector(".pgn-tabs"); if(t) t.scrollIntoView({block:"nearest"}); });

/* =======================================================================
   NAVEGACIÓN Y EVENTOS
   ======================================================================= */
const app=$("#app"); let vista="portada";
const VALIDAS=["portada","madr","upra","ant","matriz","guion","cruce","lectura","pgn"];
function ir(dest){ if(VALIDAS.indexOf(dest)<0) dest="portada"; if(location.hash.slice(1)!==dest){ try{ history.pushState(null,"","#"+dest); }catch(e){ location.hash=dest; } } vista=dest; render(); window.scrollTo(0,0); }
function render(){
  entActual = TAB[vista] ? vista : null;
  app.innerHTML = vista==="portada"?vistaPortada(): vista==="matriz"?vistaMatriz(): vista==="guion"?vistaGuion(): vista==="cruce"?vistaCruce(): vista==="lectura"?vistaAnexos(): vista==="pgn"?vistaPGN(): vistaEntidad(vista);
  if(entActual) pintarGraficas(vista);
  document.title = vista==="portada" ? "Proposición 59 · Debate MinAgricultura" : (TAB[vista]?ENT[vista].n:{matriz:"Matriz",guion:"Guion",cruce:"Cruces",lectura:"Lectura de respuesta",pgn:"Presupuesto 2027"}[vista])+" · Proposición 59";
}
function arrancar(){ cerrarModal(); const h=location.hash.slice(1); vista=VALIDAS.indexOf(h)>=0?h:"portada"; render(); }
window.addEventListener("hashchange", arrancar);
window.addEventListener("popstate", arrancar);

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-anx],[data-ir-bloque],[data-copiar-interv],[data-ir],[data-det],[data-bloque],[data-cel],[data-accion],[data-copiar],[data-copiar-g],[data-filtro],[data-res],.seg button");
  if(!el) return;
  if(el.matches(".seg button")){
    const key=el.parentNode.dataset.key, v=el.dataset.v; SEG[key] = SEG[key]===v ? "" : v; guardar("p59-seg",SEG);
    el.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(SEG[key]===b.dataset.v)));
    const sc=$("#seg-cuenta"); if(sc) sc.textContent=textoSeguimiento(); return;
  }
  if(el.dataset.res!==undefined){ elegir(+el.dataset.res); return; }
  if(el.dataset.anx){ if(vista==="lectura" && !el.closest(".modal-caja") && el.tagName==="ARTICLE"){ const d=document.getElementById("anx-"+el.dataset.anx); if(d){ d.open=true; d.scrollIntoView({behavior:lento?"auto":"smooth",block:"start"}); return; } }
    if(vista==="lectura" && el.closest("tr")){ const d=document.getElementById("anx-"+el.dataset.anx); if(d){ d.open=true; d.scrollIntoView({behavior:lento?"auto":"smooth",block:"start"}); return; } }
    abrirAnexo(+el.dataset.anx); return; }
  if(el.dataset.irBloque){ const pz=el.dataset.irBloque.split("|"); cerrarModal(); ir(pz[0]); setTimeout(()=>abrirBloque(pz[1]),60); return; }
  if(el.dataset.copiarInterv){ copiar(ANX[+el.dataset.copiarInterv].interv.join("\n\n"), el); return; }
  if(el.dataset.ir){ cerrarModal(); ir(el.dataset.ir); return; }
  if(el.dataset.bloque){ el.getAttribute("aria-expanded")==="true" ? cerrarPanel() : abrirBloque(el.dataset.bloque); return; }
  if(el.dataset.cel){ const pz=el.dataset.cel.split("-"); abrirCelda(+pz[0], pz[1]); return; }
  if(el.dataset.copiar){ copiar(el.dataset.copiar, el); return; }
  if(el.dataset.copiarG!==undefined){ const b=GUION.bloques[+el.dataset.copiarG]; copiar(b.t+" ("+b.cifra+")\n"+b.dice+" ["+b.ref+"]\nPREGUNTA: "+b.preg, el); return; }
  if(el.dataset.filtro){ const f=el.dataset.filtro; el.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===el)));
    document.querySelectorAll("#hallazgos .hallazgo").forEach(h=>{ h.hidden = f!=="todos" && h.dataset.sev!==f; }); return; }
  if(el.dataset.det){ abrirDetalle(el.dataset.det, el.dataset.foco); return; }
  const a=el.dataset.accion;
  if(a==="buscar") abrirBuscador();
  else if(a==="boyaca") abrirBoyaca();
  else if(a==="tema"){ const r=document.documentElement, oscuro = r.dataset.theme ? r.dataset.theme==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = oscuro?"light":"dark"; }
  else if(a==="exportar") exportarSeguimiento();
  else if(a==="copiar-hilo") copiar(TAB[entActual].hilo.map((h,i)=>(i+1)+". "+h[2]).join("\n\n"), el);
  else if(a==="copiar-bloque"){ const b=TAB[entActual].bloques.find(x=>x.id===$("#panel").dataset.bloque); copiar(b.puntos.map((p,i)=>(i+1)+". "+p.q).join("\n\n"), el); }
  else if(a==="cerrar-panel") cerrarPanel();
  else if(a==="cerrar-modal") cerrarModal();
  else if(a==="copiar-rep") copiar(repActual, el);
  else if(a==="atril") abrirAtril(0);
  else if(a==="copiar-guion") copiar(textoGuion(), el);
  else if(a==="cerrar-atril") cerrarAtril();
  else if(a==="atril-ant"){ if(atrilI>0){ atrilI--; pintarAtril(); } }
  else if(a==="atril-sig"){ if(atrilI<GUION.bloques.length-1){ atrilI++; pintarAtril(); } }
});
modal.addEventListener("click", e=>{ if(e.target.hasAttribute("data-cerrar-modal")) cerrarModal(); });
document.addEventListener("keydown", function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); abrirBuscador(); return; }
  if(!$("#atril").hidden){
    if(e.key==="Escape") cerrarAtril();
    else if(e.key==="ArrowRight"||e.key==="PageDown"){ if(atrilI<GUION.bloques.length-1){ atrilI++; pintarAtril(); } }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ if(atrilI>0){ atrilI--; pintarAtril(); } }
    return;
  }
  if(e.key==="Escape"){ if(!modal.hidden) cerrarModal(); else cerrarPanel(); return; }
  if((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"][data-det],[role="button"][data-anx],[role="button"][data-cel]')){ e.preventDefault(); e.target.click(); }
});
arrancar();
</script>
